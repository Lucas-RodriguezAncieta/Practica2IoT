<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Circuito lógico ESP32 actuador con tres LEDs</title><desc id="desc">GPIO25, GPIO26 y GPIO27 alimentan respectivamente LED rojo, amarillo y verde mediante resistencias de 220 ohmios; todos los cátodos comparten GND.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#17212b}.box{fill:#eef6ff;stroke:#1769aa;stroke-width:2}.part{fill:#fff8df;stroke:#986f00;stroke-width:2}.wire{stroke:#263238;stroke-width:3;fill:none}.label{font-size:18px;font-weight:bold}.small{font-size:15px}.red{fill:#ef5350}.yellow{fill:#fdd835}.green{fill:#66bb6a}</style>
  <rect class="box" x="60" y="110" width="270" height="300" rx="12"/><text class="label" x="118" y="150">ESP32 DevKit</text><text class="small" x="95" y="220">GPIO25 → LED rojo</text><text class="small" x="95" y="285">GPIO26 → LED amarillo</text><text class="small" x="95" y="350">GPIO27 → LED verde</text><text class="small" x="95" y="390">GND común</text>
  <path class="wire" d="M330 390V430"/><text class="small" x="340" y="405">GND</text><g><path class="wire" d="M330 215H445"/><rect class="part" x="445" y="195" width="90" height="40"/><text class="small" x="462" y="220">220 Ω</text><path class="wire" d="M535 215H625"/><circle class="red" cx="650" cy="215" r="20"/><text class="small" x="680" y="210">Ánodo</text><text class="small" x="680" y="230">LED rojo</text><path class="wire" d="M670 215H850V430H330"/><text class="small" x="730" y="420">Cátodo → GND común</text></g>
  <g><path class="wire" d="M330 280H445"/><rect class="part" x="445" y="260" width="90" height="40"/><text class="small" x="462" y="285">220 Ω</text><path class="wire" d="M535 280H625"/><circle class="yellow" cx="650" cy="280" r="20"/><text class="small" x="680" y="285">Ánodo LED amarillo</text><path class="wire" d="M670 280H850"/></g>
  <g><path class="wire" d="M330 345H445"/><rect class="part" x="445" y="325" width="90" height="40"/><text class="small" x="462" y="350">220 Ω</text><path class="wire" d="M535 345H625"/><circle class="green" cx="650" cy="345" r="20"/><text class="small" x="680" y="350">Ánodo LED verde</text><path class="wire" d="M670 345H850"/></g>
  <text class="small" x="60" y="480">Verificar las etiquetas serigrafiadas GPIO de la placa física antes de energizar.</text>
</svg>
