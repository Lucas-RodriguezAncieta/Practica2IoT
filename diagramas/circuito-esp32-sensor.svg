<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Circuito lógico ESP32 sensor con HC-SR04</title><desc id="desc">HC-SR04 alimentado a 5 V, tierra común, TRIG a GPIO18 y divisor ECHO de 1 kiloohmio y 2 kiloohmios hacia GPIO19.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#17212b}.box{fill:#eef6ff;stroke:#1769aa;stroke-width:2}.part{fill:#fff8df;stroke:#986f00;stroke-width:2}.wire{stroke:#263238;stroke-width:3;fill:none}.label{font-size:18px;font-weight:bold}.small{font-size:15px}.node{fill:#263238}</style>
  <rect class="box" x="70" y="100" width="270" height="270" rx="12"/><text class="label" x="125" y="140">ESP32 DevKit</text><text class="small" x="105" y="195">5 V</text><text class="small" x="105" y="245">GND</text><text class="small" x="105" y="295">GPIO18 (TRIG)</text><text class="small" x="105" y="345">GPIO19 (ECHO)</text>
  <rect class="part" x="680" y="125" width="230" height="220" rx="12"/><text class="label" x="735" y="165">HC-SR04</text><text class="small" x="705" y="215">VCC (5 V)</text><text class="small" x="705" y="255">GND</text><text class="small" x="705" y="295">TRIG</text><text class="small" x="705" y="330">ECHO</text>
  <path class="wire" d="M340 190H680"/><text class="small" x="455" y="180">5 V</text><path class="wire" d="M340 240H680"/><text class="small" x="460" y="232">GND común</text><path class="wire" d="M340 290H680"/><text class="small" x="475" y="282">TRIG → GPIO18</text>
  <path class="wire" d="M680 325H585"/><rect class="part" x="505" y="305" width="80" height="40"/><text class="small" x="520" y="330">1 kΩ</text><path class="wire" d="M505 325H340"/><text class="small" x="395" y="316">ECHO</text>
  <circle class="node" cx="430" cy="325" r="5"/><path class="wire" d="M430 325V415H585"/><rect class="part" x="585" y="395" width="80" height="40"/><text class="small" x="600" y="420">2 kΩ</text><path class="wire" d="M665 415H745"/><text class="small" x="755" y="420">GND</text><text class="small" x="350" y="365">GPIO19 recibe el nodo del divisor</text>
  <text class="small" x="70" y="460">Verificar las etiquetas serigrafiadas GPIO de la placa física antes de energizar.</text>
</svg>
